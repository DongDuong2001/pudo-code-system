name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        run: npm test

      - name: Install MCP server dependencies
        run: npm ci --prefix packages/pudo-mcp-server

      - name: Test MCP server
        run: npm run mcp:test

      - name: Validate PUDO operating layer
        run: npm run pudo:check

      - name: Diagnose workflow gaps
        run: npm run pudo:doctor
