name: Publish MCP Server

# Triggers:
#   1. Push a tag like v0.2.0 or v0.2.0-alpha.1  →  full publish
#   2. workflow_dispatch                           →  manual publish with dry-run option
#
# Publishing to GitHub Packages uses the built-in GITHUB_TOKEN (no setup needed).
# Publishing to npm uses the NPM_TOKEN repo secret. If it is not set, that step
# exits cleanly — secrets context cannot be used in `if:` conditions on GitHub.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build and test only, skip publishing"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build-test-publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to GitHub Packages

    defaults:
      run:
        working-directory: packages/pudo-mcp-server

    steps:
      # ── Setup ─────────────────────────────────────────────────────────────

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/pudo-mcp-server/package-lock.json
          # Configures ~/.npmrc with //npm.pkg.github.com/:_authToken so
          # NODE_AUTH_TOKEN is picked up automatically by npm publish.
          registry-url: "https://npm.pkg.github.com/"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Build ─────────────────────────────────────────────────────────────

      - name: Build
        run: npm run build

      # ── Test ──────────────────────────────────────────────────────────────

      - name: Test
        run: node --test dist/tests/*.test.js
        env:
          PUDO_PACKAGE_ROOT: ${{ github.workspace }}

      # ── Version info ──────────────────────────────────────────────────────

      - name: Read package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      # ── Publish to GitHub Packages ────────────────────────────────────────
      # publishConfig.registry in package.json points to npm.pkg.github.com.
      # NODE_AUTH_TOKEN is picked up automatically by npm.
      # Skip if this version is already published (avoids E409 on re-runs).

      - name: Check GitHub Packages for existing version
        id: gh_pkg
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          PUBLISHED=$(npm view "@dongduong2001/mcp-server@${VERSION}" version \
            --registry=https://npm.pkg.github.com/ 2>/dev/null || true)
          if [[ "$PUBLISHED" == "$VERSION" ]]; then
            echo "Version ${VERSION} is already on GitHub Packages — skipping publish."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: ${{ github.event.inputs.dry_run != 'true' && steps.gh_pkg.outputs.already_published != 'true' }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Publish to npm public registry ────────────────────────────────────
      # setup-node wrote `@dongduong2001:registry=https://npm.pkg.github.com/`
      # into ~/.npmrc. We must overwrite that scope mapping to point to npmjs.org
      # before publishing, otherwise npm ignores --registry for scoped packages.
      # If NPM_TOKEN is empty the step exits cleanly without failing.

      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [[ -z "$NPM_TOKEN" ]]; then
            echo "NPM_TOKEN not configured — skipping npm publish."
            echo "npm_result=skipped_no_token" >> "$GITHUB_ENV"
            exit 0
          fi
          VERSION="${{ steps.pkg.outputs.version }}"
          npm config set @dongduong2001:registry https://registry.npmjs.org/
          npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          PUBLISHED=$(npm view "@dongduong2001/mcp-server@${VERSION}" version 2>/dev/null || true)
          if [[ "$PUBLISHED" == "$VERSION" ]]; then
            echo "Version ${VERSION} is already on npm — skipping publish."
            echo "npm_result=skipped_exists" >> "$GITHUB_ENV"
            exit 0
          fi
          npm pkg delete publishConfig
          npm publish --access public
          echo "npm_result=published" >> "$GITHUB_ENV"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Job summary ───────────────────────────────────────────────────────

      - name: Write job summary
        if: always()
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          VERSION="${{ steps.pkg.outputs.version }}"
          echo "## MCP Server Publish — \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test  | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${DRY:-false}" == "true" ]]; then
            echo "| GitHub Packages | ⏭ dry run |" >> "$GITHUB_STEP_SUMMARY"
            echo "| npm registry    | ⏭ dry run |" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.gh_pkg.outputs.already_published }}" == "true" ]]; then
            echo "| GitHub Packages | ⏭ already published |" >> "$GITHUB_STEP_SUMMARY"
            echo "| npm registry    | see Publish to npm step |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| GitHub Packages | ✅ published |" >> "$GITHUB_STEP_SUMMARY"
            echo "| npm registry    | see Publish to npm step |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${DRY:-false}" != "true" && "${{ steps.gh_pkg.outputs.already_published }}" == "true" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> To publish again, bump \`packages/pudo-mcp-server/package.json\` and push a new \`v*\` tag." >> "$GITHUB_STEP_SUMMARY"
          fi
